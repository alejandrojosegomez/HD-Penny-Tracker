# One image, two services. Build with `docker compose build`, start with `docker compose up -d`.
x-app: &app
  image: hd-penny-tracker:latest
  env_file: .env
  volumes:
    - ./data:/app/data
    - ./config:/app/config
  restart: unless-stopped
  init: true                 # proper signal handling / zombie reaping
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  worker:
    <<: *app
    build: .
    container_name: hd-penny-worker
    command: python -m tracker run

  web:
    <<: *app
    container_name: hd-penny-web
    pull_policy: never         # uses the image the worker service builds
    depends_on: [worker]
    command: python -m tracker serve
    ports:
      # only this computer can open the dashboard. To use it from your phone on the same
      # Wi-Fi, change to "8000:8000" (anyone on that network can then reach it).
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
