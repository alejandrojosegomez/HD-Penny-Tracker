name: Tracker tests

# The store tracker (dashboard API, manual prices, scoring, community lists).
# The brain has its own workflow; its daily bot commits only touch brain/, so they don't trigger this.
on:
  push:
    paths:
      - "tracker/**"
      - "web/**"
      - "config/**"
      - "tests/test_api.py"
      - "tests/test_detect.py"
      - "tests/test_community.py"
      - "tests/test_hd_block.py"
      - "tests/test_providers.py"
      - "tests/test_manual_single_write.py"
      - "tests/test_collector.py"
      - "tests/test_api_v1.py"
      - "tests/test_platform_integration.py"
      - "tests/conftest.py"
      - "requirements*.txt"
      - ".github/workflows/tracker-tests.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # no `playwright install`: the tests never launch a browser
      - run: pip install -r requirements-dev.txt
      - run: >-
          python -m pytest -q -W ignore::UserWarning
          tests/test_api.py tests/test_detect.py tests/test_community.py tests/test_hd_block.py
          tests/test_providers.py tests/test_manual_single_write.py
          tests/test_collector.py tests/test_api_v1.py tests/test_platform_integration.py
          --deselect tests/test_platform_integration.py::test_penny_brain_is_untouched_and_its_tests_pass
