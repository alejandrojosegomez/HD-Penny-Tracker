name: Brain daily

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 7:00 AM Florida (EST); 8:00 AM during daylight time
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: brain-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/requirements.txt

      - run: pip install -r brain/requirements.txt

      - name: Collect, train, report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m brain.run

      - name: Save what the brain learned
        if: always()
        run: |
          git config user.name "penny-brain[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brain/state brain/reports brain/predictions.csv
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "brain: daily update $(date +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
