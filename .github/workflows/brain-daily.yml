name: Brain daily

on:
  schedule:
    # GitHub starts scheduled runs late: for this repo every one has started 7-10 hours
    # after its time, and on 2026-11-21 one never started. So there are several schedules
    # (UTC) spread from the evening before to midday. Whichever GitHub starts first after
    # 5:00 AM Florida time runs the brain; brain/guard.py makes every other one stop, so
    # there is exactly one Telegram summary a day, with no button to press.
    - cron: "13 1 * * *"    # 8:13 PM Florida, day before
    - cron: "13 3 * * *"    # 10:13 PM Florida, day before
    - cron: "13 5 * * *"    # 12:13 AM Florida
    - cron: "13 7 * * *"    # 2:13 AM Florida
    - cron: "13 9 * * *"    # 4:13 AM Florida
    - cron: "7 11 * * *"    # 6:07 AM Florida
    - cron: "0 12 * * *"    # 7:00 AM Florida
    - cron: "17 14 * * *"   # 9:17 AM Florida
    - cron: "43 17 * * *"   # 12:43 PM Florida
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      force:
        description: "Run even if today's run already happened (sends a second summary)"
        type: boolean
        default: false
      simulate_failure:
        description: "Test: fail on purpose to check the Slack alert"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: brain-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
    steps:
      # check out the branch as it is when this job starts (not the commit the schedule fired
      # on), so a backup that waited behind the main run sees the main run's saved state
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/requirements.txt

      - name: Install
        id: install
        run: pip install -r brain/requirements.txt

      - name: Already ran today?
        id: guard
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force || false }}
        run: python -m brain.guard --event "$EVENT" --force "$FORCE"

      - name: Self-test before the run
        id: selftest
        if: steps.guard.outputs.run == 'true'
        run: |
          set -o pipefail
          pip install pytest==8.3.4 pyyaml==6.0.2 >/dev/null
          python -m pytest -q -W ignore::UserWarning tests/test_brain.py tests/test_brain_e2e.py \
            tests/test_brain_alert.py tests/test_brain_insights.py tests/test_brain_guard.py 2>&1 | tee selftest.log

      - name: Simulated failure (test only)
        id: simulated
        if: ${{ inputs.simulate_failure && steps.guard.outputs.run == 'true' }}
        run: echo "::error::Simulated failure to test the Slack alert" && exit 1

      - name: Collect, train, report
        id: brain
        if: steps.guard.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m brain.run 2>&1 | tee brain_run.log

      - name: Save what the brain learned
        id: save
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          set -o pipefail
          (
            set -e
            git config user.name "penny-brain[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brain
            if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
            git commit -m "brain: daily update $(date +%F)"
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs && git push; then exit 0; fi
              sleep 10
            done
            echo "::error::could not push the daily update after 3 tries"
            exit 1
          ) 2>&1 | tee save.log

      - name: Alert Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT_INSTALL: ${{ steps.install.outcome }}
          OUT_GUARD: ${{ steps.guard.outcome }}
          OUT_SELFTEST: ${{ steps.selftest.outcome }}
          OUT_SIMULATED: ${{ steps.simulated.outcome }}
          OUT_BRAIN: ${{ steps.brain.outcome }}
          OUT_SAVE: ${{ steps.save.outcome }}
        run: python -m brain.alert
