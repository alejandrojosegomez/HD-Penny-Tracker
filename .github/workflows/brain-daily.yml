name: Brain daily

on:
  schedule:
    # GitHub sometimes skips a scheduled run entirely (2026-11-21). The first cron is the
    # main run; the others are backups that only run the brain if today's run is missing
    # (see brain/guard.py), so there is never a second Telegram summary on the same day.
    # Keep the first entry in sync with PRIMARY_CRON below.
    - cron: "0 12 * * *"    # main:   12:00 UTC = 7:00 AM Florida (EST); 8:00 AM during daylight time
    - cron: "17 14 * * *"   # backup: 9:17 AM Florida (EST)
    - cron: "43 17 * * *"   # backup: 12:43 PM Florida (EST)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      simulate_failure:
        description: "Test: fail on purpose to check the Slack alert"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: brain-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
      PRIMARY_CRON: "0 12 * * *"
    steps:
      # check out the branch as it is when this job starts (not the commit the schedule fired
      # on), so a backup that waited behind the main run sees the main run's saved state
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/requirements.txt

      - name: Install
        id: install
        run: pip install -r brain/requirements.txt

      - name: Already ran today?
        id: guard
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python -m brain.guard --event "$EVENT" --schedule "$SCHEDULE" --primary "$PRIMARY_CRON"

      - name: Simulated failure (test only)
        id: simulated
        if: ${{ inputs.simulate_failure && steps.guard.outputs.run == 'true' }}
        run: echo "::error::Simulated failure to test the Slack alert" && exit 1

      - name: Collect, train, report
        id: brain
        if: steps.guard.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m brain.run 2>&1 | tee brain_run.log

      - name: Save what the brain learned
        id: save
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          set -o pipefail
          (
            set -e
            git config user.name "penny-brain[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brain
            if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
            git commit -m "brain: daily update $(date +%F)"
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs && git push; then exit 0; fi
              sleep 10
            done
            echo "::error::could not push the daily update after 3 tries"
            exit 1
          ) 2>&1 | tee save.log

      - name: Alert Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT_INSTALL: ${{ steps.install.outcome }}
          OUT_GUARD: ${{ steps.guard.outcome }}
          OUT_SIMULATED: ${{ steps.simulated.outcome }}
          OUT_BRAIN: ${{ steps.brain.outcome }}
          OUT_SAVE: ${{ steps.save.outcome }}
        run: python -m brain.alert
