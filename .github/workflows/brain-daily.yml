name: Brain daily

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 7:00 AM Florida (EST); 8:00 AM during daylight time
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      simulate_failure:
        description: "Test: fail on purpose to check the Slack alert"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: brain-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/requirements.txt

      - name: Install
        id: install
        run: pip install -r brain/requirements.txt

      - name: Simulated failure (test only)
        id: simulated
        if: ${{ inputs.simulate_failure }}
        run: echo "::error::Simulated failure to test the Slack alert" && exit 1

      - name: Collect, train, report
        id: brain
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m brain.run 2>&1 | tee brain_run.log

      - name: Save what the brain learned
        id: save
        if: always()
        run: |
          set -o pipefail
          (
            set -e
            git config user.name "penny-brain[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brain
            if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
            git commit -m "brain: daily update $(date +%F)"
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs && git push; then exit 0; fi
              sleep 10
            done
            echo "::error::could not push the daily update after 3 tries"
            exit 1
          ) 2>&1 | tee save.log

      - name: Alert Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT_INSTALL: ${{ steps.install.outcome }}
          OUT_SIMULATED: ${{ steps.simulated.outcome }}
          OUT_BRAIN: ${{ steps.brain.outcome }}
          OUT_SAVE: ${{ steps.save.outcome }}
        run: python -m brain.alert
