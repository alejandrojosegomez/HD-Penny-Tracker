<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HD Penny Tracker</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262a33; --text:#e8eaf0; --muted:#8b93a7; --hd:#f96302; --ok:#2ecc71; --warn:#f1c40f; --hot:#ff4d4d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:18px; margin:0; color:var(--hd); }
  header .status { color:var(--muted); font-size:12px; margin-left:auto; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; padding:12px 18px; border-bottom:1px solid var(--line); }
  select, input, button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; }
  button.primary { background:var(--hd); border-color:var(--hd); color:#fff; font-weight:600; cursor:pointer; }
  main { padding:14px 18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .card img { width:100%; height:160px; object-fit:contain; background:#fff; }
  .body { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .name { font-weight:600; line-height:1.3; }
  .desc { color:var(--muted); font-size:12px; max-height:3.9em; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .price { font-size:20px; font-weight:700; }
  .was { color:var(--muted); text-decoration:line-through; font-size:12px; }
  .off { color:var(--ok); font-weight:600; }
  .store { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:12px; font-weight:700; }
  .b-hot { background:var(--hot); color:#fff; } .b-watch { background:var(--warn); color:#000; } .b-low { background:var(--line); color:var(--muted); }
  .reasons { font-size:12px; color:var(--muted); }
  .spark { height:36px; width:100%; }
  .meta { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; }
  .meta code { background:#0b0d11; padding:1px 5px; border-radius:4px; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 0; }
  a { color:inherit; }
</style>
</head>
<body>
<header>
  <h1>HD Penny Tracker</h1>
  <span id="count" class="status"></span>
  <span id="live" class="status">connecting…</span>
</header>
<div class="controls">
  <select id="store"><option value="">All stores</option></select>
  <select id="minscore">
    <option value="0">Any score</option>
    <option value="45">Watch (45+)</option>
    <option value="70" selected>Go scan (70+)</option>
  </select>
  <input id="q" placeholder="search name / brand / internet #" style="flex:1;min-width:160px">
  <input id="add" placeholder="add internet # (9-10 digits)" style="width:190px">
  <button class="primary" id="addbtn">Add</button>
</div>
<main id="grid"><div class="empty">Loading…</div></main>

<script>
let items = [], stores = [];
const $ = s => document.querySelector(s);

async function loadStores(){
  stores = await (await fetch('/api/stores')).json();
  for (const s of stores){ const o=document.createElement('option'); o.value=s.hd_store_id; o.textContent=`${s.name} (#${s.hd_store_id})`; $('#store').appendChild(o); }
}
function spark(points){
  if(!points || points.length<2) return '';
  const w=280,h=36, ps=points.map(p=>p.p); const min=Math.min(...ps), max=Math.max(...ps); const span=(max-min)||1;
  const d=ps.map((p,i)=>`${i?'L':'M'}${(i/(ps.length-1))*w},${h-((p-min)/span)*(h-4)-2}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#f96302" stroke-width="2"/></svg>`;
}
function badge(score){
  if(score>=70) return `<span class="badge b-hot">GO SCAN · ${score}</span>`;
  if(score>=45) return `<span class="badge b-watch">watch · ${score}</span>`;
  return `<span class="badge b-low">${score}</span>`;
}
function render(){
  const st=$('#store').value, ms=+$('#minscore').value, q=$('#q').value.toLowerCase();
  const rows=items.filter(r=>(!st||r.hd_store_id===st)&&r.score>=ms&&(!q||`${r.name} ${r.brand} ${r.internet_number} ${r.sku}`.toLowerCase().includes(q)));
  $('#count').textContent=`${rows.length} of ${items.length} item-store pairs`;
  if(!rows.length){ $('#grid').innerHTML='<div class="empty">Nothing matches. Add an internet number above or lower the score filter.</div>'; return; }
  $('#grid').innerHTML=rows.map(r=>`
    <div class="card">
      ${r.image_url?`<img src="${r.image_url}" alt="" loading="lazy" onerror="this.remove()">`:''}
      <div class="body">
        <div class="row"><span class="name">${r.name||('Item '+r.internet_number)}</span>${badge(r.score)}</div>
        <div class="desc">${r.description||''}</div>
        <div class="row">
          <span class="price">${r.price!=null?'$'+r.price.toFixed(2):'n/a'} ${r.original_price&&r.discount_pct>0?`<span class="was">$${r.original_price.toFixed(2)}</span>`:''}</span>
          <span class="off">${r.discount_pct?r.discount_pct.toFixed(0)+'% off':''}</span>
        </div>
        <div class="store">${r.store_name} (#${r.hd_store_id}) · ${(r.availability||'unknown').replace('_',' ')}${r.stock!=null?' · qty '+r.stock:''}</div>
        ${spark(r.history_points)}
        <div class="reasons">${(r.reasons||[]).join(' · ')}</div>
        <div class="meta"><span>Internet # <code>${r.internet_number}</code>${r.sku?' · SKU <code>'+r.sku+'</code>':''}</span><a href="${r.product_url||'#'}" target="_blank" rel="noopener">open</a></div>
      </div>
    </div>`).join('');
}
function connect(){
  const es=new EventSource('/stream');
  es.addEventListener('items', e=>{ items=JSON.parse(e.data); $('#live').textContent='live · '+new Date().toLocaleTimeString(); render(); });
  es.onerror=()=>{ $('#live').textContent='reconnecting…'; };
}
$('#store').onchange=$('#minscore').onchange=$('#q').oninput=render;
$('#addbtn').onclick=async()=>{
  const n=$('#add').value.trim(); if(!/^\d{9,10}$/.test(n)) return alert('9 or 10 digits please');
  const r=await fetch('/api/items/'+n,{method:'POST'}); const j=await r.json();
  alert(j.added?'Added. It will be scraped on the next run.':'Already on the watchlist.'); $('#add').value='';
};
loadStores().then(connect);
</script>
</body>
</html>
